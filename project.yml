name: GrubShelf
# PBXProject attributes; align with your Xcode to clear “Update to recommended settings” (e.g. 2630 for recent Xcode 26.x).
attributes:
  LastUpgradeCheck: "2630"

options:
  bundleIdPrefix: com.grubshelf
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "17.0"
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  # Pinned past 9.1.0: Google’s Package.swift on main fixes SwiftPM deprecations (#579). Switch back to `from: "9.x"` once a tagged release includes that commit.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    revision: 4d94ec77d06c8359766f913c6705e7e7756d2e24

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    CLANG_ENABLE_EXPLICIT_MODULES: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  GrubShelf:
    type: application
    platform: iOS
    sources:
      - GrubShelf
    dependencies:
      - target: GrubShelfWidget
        embed: true
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: GrubShelf/Info.plist
      properties:
        NSCameraUsageDescription: GrubShelf uses the camera to identify products you add to your pantry.
        NSPhotoLibraryUsageDescription: GrubShelf uses your photo library so you can select product images for pantry item recognition.
        NSPhotoLibraryAddUsageDescription: GrubShelf may save processed pantry photos to your library when you choose to keep them.
        CFBundleURLTypes:
          - CFBundleURLName: com.grubshelf.auth
            CFBundleURLSchemes:
              - grubshelf
        UIAppFonts:
          - Inter-Variable.ttf
          - Outfit-Variable.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-SemiBold.ttf
          - IBMPlexMono-Bold.ttf
    settings:
      base:
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        CODE_SIGN_ENTITLEMENTS: GrubShelf/GrubShelf.entitlements
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

  GrubShelfWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GrubShelfWidget
      - path: GrubShelf/WidgetShared
        includes:
          - ShoppingListWidgetSnapshot.swift
          - ShoppingListWidgetSnapshotStorage.swift
          - ShoppingListWidgetToggleQueue.swift
    info:
      path: GrubShelfWidget/Info.plist
      properties:
        CFBundleDisplayName: GrubShelf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grubshelf.GrubShelf.GrubShelfWidget
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: GrubShelfWidget/GrubShelfWidget.entitlements
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

  GrubShelfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GrubShelfTests
        excludes:
          - Fixtures/**
    resources:
      - GrubShelfTests/Fixtures
    dependencies:
      - target: GrubShelf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  GrubShelfUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GrubShelfUITests
    dependencies:
      - target: GrubShelf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: GrubShelf

schemes:
  GrubShelf:
    build:
      targets:
        GrubShelf: all
        GrubShelfWidget: all
        GrubShelfUITests: [test]
    test:
      targets:
        - GrubShelfTests
        - GrubShelfUITests
      gatherCoverageData: true
