name: Swift Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Pick iOS Simulator
      id: sim
      run: |
        set -euo pipefail
        UDID="$(python3 <<'PY'
        import json
        import subprocess
        import sys

        j = json.loads(
            subprocess.check_output(
                ["xcrun", "simctl", "list", "devices", "available", "-j"],
                text=True,
            )
        )
        for runtime in sorted(j["devices"].keys(), reverse=True):
            if "iOS" not in runtime:
                continue
            for d in j["devices"][runtime]:
                if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                    print(d["udid"])
                    sys.exit(0)
        sys.stderr.write("No available iPhone simulator found\n")
        sys.exit(1)
        PY
        )"
        echo "udid=${UDID}" >> "${GITHUB_OUTPUT}"
        echo "Using simulator ${UDID}"

    - name: Run GrubShelf tests
      run: |
        set -euo pipefail
        xcodebuild test \
          -project GrubShelf.xcodeproj \
          -scheme GrubShelf \
          -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
